[project]
name = "fexogold-api"
version = "0.1.0"
description = "FexoGold API — злато-обезпечена сметка и карта"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "sqlalchemy>=2.0",
  "pyjwt>=2.8",
  "pydantic[email]>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py311"
