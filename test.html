<!DOCTYPE html>
<html>
<head>
  <title>Web3 Mock Test</title>
  <script src="web3-mock.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #3498db;
      color: white;
    }
    button:hover {
      background: #2980b9;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      background: #f0f0f0;
      border-radius: 5px;
      font-family: monospace;
    }
    h2 {
      color: #2c3e50;
    }
    .test-controls button {
      background: #27ae60;
    }
    .test-controls button:hover {
      background: #1e8449;
    }
  </style>
</head>
<body>
  <h1>Web3 Mock Test Page</h1>

  <div class="section">
    <h2>Connection Status</h2>
    <p id="connection-status" class="status">Not connected</p>
    <button id="connect">Connect Wallet</button>
    <button id="disconnect">Disconnect</button>
  </div>

  <div class="section">
    <h2>Wallet Info</h2>
    <p id="wallet-address" class="status">Address: -</p>
    <p id="wallet-balance" class="status">Balance: -</p>
    <p id="chain-id" class="status">Chain ID: -</p>
  </div>

  <div class="section">
    <h2>Actions</h2>
    <button id="get-balance">Get Balance</button>
    <button id="sign-message">Sign Message</button>
    <button id="send-tx">Send Transaction</button>
  </div>

  <div class="section test-controls">
    <h2>Mock Test Controls</h2>
    <p>Use these to simulate wallet events:</p>
    <button onclick="Web3Mock.switchAccount(1)">Switch to Account 2</button>
    <button onclick="Web3Mock.switchAccount(2)">Switch to Account 3</button>
    <button onclick="Web3Mock.switchChain(Web3Mock.chains.GOERLI)">Switch to Goerli</button>
    <button onclick="Web3Mock.switchChain(Web3Mock.chains.POLYGON)">Switch to Polygon</button>
    <button onclick="console.log(Web3Mock.getState())">Log State</button>
  </div>

  <div class="section">
    <h2>Logs</h2>
    <div id="logs" class="status" style="min-height: 100px; max-height: 300px; overflow-y: auto;"></div>
    <button onclick="document.getElementById('logs').innerHTML = ''">Clear Logs</button>
  </div>

  <script>
    // Logging helper
    function log(message) {
      const logsDiv = document.getElementById('logs');
      const time = new Date().toLocaleTimeString();
      logsDiv.innerHTML += `[${time}] ${message}<br>`;
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    // UI Elements
    const connectBtn = document.getElementById('connect');
    const disconnectBtn = document.getElementById('disconnect');
    const connectionStatus = document.getElementById('connection-status');
    const walletAddress = document.getElementById('wallet-address');
    const walletBalance = document.getElementById('wallet-balance');
    const chainIdEl = document.getElementById('chain-id');

    // Update UI
    function updateUI(connected, address, balance, chainId) {
      connectionStatus.textContent = connected ? 'Connected' : 'Not connected';
      connectionStatus.style.background = connected ? '#d4edda' : '#f8d7da';
      walletAddress.textContent = `Address: ${address || '-'}`;
      walletBalance.textContent = `Balance: ${balance || '-'}`;
      chainIdEl.textContent = `Chain ID: ${chainId || '-'}`;
    }

    // Connect
    connectBtn.onclick = async () => {
      try {
        log('Requesting connection...');
        const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
        const chainId = await ethereum.request({ method: 'eth_chainId' });
        log(`Connected: ${accounts[0]}`);
        updateUI(true, accounts[0], null, chainId);
      } catch (err) {
        log(`Connection error: ${err.message}`);
      }
    };

    // Disconnect
    disconnectBtn.onclick = () => {
      Web3Mock.disconnect();
      updateUI(false, null, null, null);
      log('Disconnected');
    };

    // Get Balance
    document.getElementById('get-balance').onclick = async () => {
      try {
        const accounts = await ethereum.request({ method: 'eth_accounts' });
        if (accounts.length === 0) {
          log('Not connected');
          return;
        }
        const balance = await ethereum.request({
          method: 'eth_getBalance',
          params: [accounts[0], 'latest']
        });
        const ethBalance = parseInt(balance, 16) / 1e18;
        log(`Balance: ${ethBalance} ETH`);
        updateUI(true, accounts[0], `${ethBalance} ETH`, ethereum.chainId);
      } catch (err) {
        log(`Error: ${err.message}`);
      }
    };

    // Sign Message
    document.getElementById('sign-message').onclick = async () => {
      try {
        const accounts = await ethereum.request({ method: 'eth_accounts' });
        if (accounts.length === 0) {
          log('Not connected');
          return;
        }
        const message = 'Hello Web3 Mock!';
        const signature = await ethereum.request({
          method: 'personal_sign',
          params: [message, accounts[0]]
        });
        log(`Signature: ${signature.substring(0, 20)}...`);
      } catch (err) {
        log(`Error: ${err.message}`);
      }
    };

    // Send Transaction
    document.getElementById('send-tx').onclick = async () => {
      try {
        const accounts = await ethereum.request({ method: 'eth_accounts' });
        if (accounts.length === 0) {
          log('Not connected');
          return;
        }
        const txHash = await ethereum.request({
          method: 'eth_sendTransaction',
          params: [{
            from: accounts[0],
            to: '0x0000000000000000000000000000000000000000',
            value: '0x0'
          }]
        });
        log(`TX Hash: ${txHash.substring(0, 20)}...`);
      } catch (err) {
        log(`Error: ${err.message}`);
      }
    };

    // Event listeners
    ethereum.on('accountsChanged', (accounts) => {
      log(`Accounts changed: ${accounts[0] || 'none'}`);
      if (accounts.length > 0) {
        updateUI(true, accounts[0], null, ethereum.chainId);
      } else {
        updateUI(false, null, null, null);
      }
    });

    ethereum.on('chainChanged', (chainId) => {
      log(`Chain changed: ${chainId}`);
      chainIdEl.textContent = `Chain ID: ${chainId}`;
    });

    ethereum.on('connect', (info) => {
      log(`Connected event: ${JSON.stringify(info)}`);
    });

    ethereum.on('disconnect', (error) => {
      log(`Disconnect event: ${JSON.stringify(error)}`);
    });

    // Initial state
    log('Web3 Mock loaded');
    log(`Available accounts: ${Web3Mock.accounts.length}`);
  </script>
</body>
</html>
